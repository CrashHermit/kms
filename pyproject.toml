[project]
name = "kms"
version = "0.1.0"
description = "knowledge management and metacognitive learning system"
requires-python = ">=3.13, <=3.14"

dependencies = [
  "pydantic>=2.0",
  "dspy-ai>=3.2.1",
  "langgraph>=0.2",
  "fsrs>=6.3.1",
  "neo4j>=6.2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "inquirerpy>=0.3.4",
  "pypdfium2>=4",
  "pillow>=10",
  "pydantic-settings>=2.15.0",
]

[project.scripts]
kms = "kms.tui:run"
kms-maintenance = "kms.maintenance:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kms"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.uv]
package = true

[build-system]                                                                                                                                                                             
requires = ["hatchling"]                                                                                                                                                                   
build-backend = "hatchling.build"  

