[project]
name = "kms"
version = "0.1.0"
description = "knowledge management and metacognitive learning system"
requires-python = ">=3.13, <=3.14"
# Light, portable core: the LLM pipeline (OCR/extract/seam/split/find/type) and
# its runtime. Everything here is CPU-only and installs in seconds — this is
# what `uv sync` installs and what web sessions need.
dependencies = [
  "pydantic>=2.0",
  "dspy-ai>=3.2.1",
  "langgraph>=0.2",
  "fsrs>=6.3.1",
  "neo4j>=6.2.0",
  # Graph tier's HTTP Query-API transport (Bolt fallback for HTTPS-only egress).
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "inquirerpy>=0.3.4",
  "pypdfium2>=4",
  "pillow>=10",
]

[project.scripts]
kms = "kms.tui:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# One tool for format + lint + import order. src-layout aware so `kms` resolves
# as first-party. Target the minimum supported interpreter.
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
# Light, low-noise set: pyflakes (unused imports/vars, undefined names), import
# order, pycodestyle errors, bugbear (likely bugs), pyupgrade (keeps the
# modern-typing house style). Line length is owned by the formatter, and long
# DSPy `description=` / prompt strings are intentional, so E501 is off.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kms"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.uv]
package = true

[build-system]                                                                                                                                                                             
requires = ["hatchling"]                                                                                                                                                                   
build-backend = "hatchling.build"  

