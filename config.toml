# ── local model serving (router-mode llama-server) ───────────────────

[serving]
manage = true
host = "127.0.0.1"
port = 8080
ready_timeout = 300.0
poll_interval = 1.0
max_loaded_models = 1
request_timeout = 30.0
terminate_timeout = 15.0

[serving.module_models]
corrector = "qwen3.5-9b"
procedure_creator = "qwen3.5-9b"
formatter = "qwen3.5-9b"
formatter_router = "qwen3.5-9b"
formatter_editor = "qwen3.5-9b"
seam_merger = "qwen3.5-9b"
seam_rewriter = "qwen3.5-9b"
splitter = "qwen3.5-9b"
instruction_router = "qwen3.5-9b"
instruction_grower = "qwen3.5-9b"
pedagogical_component_finder = "qwen3.5-9b"
role_typer = "qwen3.5-9b"
statement_partitioner = "qwen3.5-9b"
procedure_partitioner = "qwen3.5-9b"
atomic_fact_extractor = "qwen3.5-9b"
triplet_extractor = "qwen3.5-9b"
entity_enrichment = "qwen3.5-9b"
predicate_enrichment = "qwen3.5-9b"
statement_enrichment = "qwen3.5-9b"
procedure_enrichment = "qwen3.5-9b"
statement_hub_builder = "qwen3.5-9b"
procedure_hub_builder = "qwen3.5-9b"
entity_hub_builder = "qwen3.5-9b"
predicate_hub_builder = "qwen3.5-9b"
triplet_hub_builder = "qwen3.5-9b"
search_judge = "qwen3.5-9b"
decompose_judge = "qwen3.5-9b"
query_decomposer = "qwen3.5-9b"
entity_card_router = "gemma-4-e4b-it"
entity_fact_generator = "gemma-4-e4b-it"
entity_card_generator = "gemma-4-e4b-it"

[serving.presets."glm-ocr"]
model = "~/models/glm-ocr/GLM-OCR-Q8_0.gguf"
mmproj = "~/models/glm-ocr/mmproj-GLM-OCR-Q8_0.gguf"
ctx_size = 32768
n_gpu_layers = 999
no_warmup = true
parallel = 1

[serving.presets."qwen3.5-9b"]
model = "~/models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf"
mmproj = "~/models/qwen3.5-9b/mmproj-F16.gguf"
ctx_size = 32768
cache_type_k = "q4_0"
cache_type_v = "q4_0"
n_gpu_layers = 999
no_warmup = true
parallel = 1
reasoning = "off"

[serving.presets."qwen3-vl-4b"]
model = "~/models/qwen3-vl-4b/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
mmproj = "~/models/qwen3-vl-4b/mmproj-Qwen3VL-4B-Instruct-F16.gguf"
ctx_size = 8192
n_gpu_layers = 999
no_warmup = true
parallel = 1
temperature = 0.0
threads = 12

[serving.presets."gemma-4-e4b-it"]
model = "~/models/gemma-4-e4b-it/gemma-4-E4B-it-Q4_K_M.gguf"
mmproj = "~/models/gemma-4-e4b-it/mmproj-F16.gguf"
ctx_size = 32768
cache_type_k = "q4_0"
cache_type_v = "q4_0"
n_gpu_layers = 999
no_warmup = true
parallel = 1

# ── external services ────────────────────────────────────────────────

[embeddings]
model = "voyage-multimodal-3.5"
base_url = "https://api.voyageai.com/v1"
dimension = 1024
batch_size = 200
timeout_seconds = 60.0

[reranker]
model = "nvidia/llama-nemotron-rerank-vl-1b-v2:free"
base_url = "https://openrouter.ai/api/v1"
timeout_seconds = 60.0

[ocr]
model = "mistral-ocr-latest"
url = "https://api.mistral.ai/v1/ocr"
render_scale = 1.0
block_crop_scale = 1.0

[database]
database = "neo4j"
transport = "auto"
http_timeout = 60.0
bolt_probe_timeout = 5.0
max_connection_lifetime = 300.0
http_port = 7474
https_port = 7473

# ── module settings ─────────────────────────────────────────────────

[image]
max_dim = 768

[concurrency]
max_concurrent_calls = 16
recursion_limit = 1000

[recording]
enabled = false

[stages.splitter]
backward_context_budget = 200
lookahead_budget = 2000

[stages.finders]
lookahead_budget = 2000
max_lookahead_budget = 8000

[stages.finders.instruction_finder]
context_budget = 300

[stages.entity_enrichment]
before_budget = 200
after_budget = 200
max_concurrent_calls = 16

[stages.predicate_enrichment]
before_budget = 200
after_budget = 200
max_concurrent_calls = 16

[stages.triplet]
window_budget = 600
backward_context_budget = 400
forward_context_budget = 400

[stages.entity_hubs]
recall_threshold = 0.55
merge_above = 0.85
separate_below = 0.35
max_concurrent_calls = 16

[stages.predicate_hubs]
recall_threshold = 0.55
merge_above = 0.85
separate_below = 0.35
max_concurrent_calls = 16

[stages.triplet_hubs]
max_concurrent_calls = 16

[stages.statement_enrichment]
max_concurrent_calls = 16

[stages.procedure_enrichment]
max_concurrent_calls = 16

[stages.search]
top_k = 20
rerank_top_n = 5

[stages.procedure]
entity_definition_top_k = 10

[stages.statement_hubs]
recall_threshold = 0.55
merge_above = 0.85
separate_below = 0.35
max_concurrent_calls = 16

[stages.procedure_hubs]
recall_threshold = 0.55
merge_above = 0.85
separate_below = 0.35
max_concurrent_calls = 16
