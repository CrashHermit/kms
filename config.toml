# KMS configuration.
#
# Precedence (highest first):
#   1. environment variables (KMS_MODELS__MODULES__FORMATTER__MODEL, ...)
#   2. the repo-root .env file
#   3. this file
#   4. code defaults
#
# Secrets (API keys, the database password) are intentionally NOT here;
# put them in .env or export them in the shell.

# ── LLM modules ──────────────────────────────────────────────────────
# base_url set (e.g. "http://127.0.0.1:8080/v1") means a local server;
# base_url = "" means "use the provider's own endpoint" (remote).

# Every LLM boundary is configured by module. There is no shared pipeline
# model: modules may use the same provider/model, but the dependency is
# explicit at each module boundary. The ``model`` value here is an
# OpenAI-compatible provider-prefixed ID; its suffix must match the local
# router preset name (see [serving.module_models]).

[models.modules.corrector]
base_url = "http://127.0.0.1:8080/v1"
model = "openai/gemma-4-e4b-qat-vision"
max_tokens = 2048

