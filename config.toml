n_gpu_layers = 999
no_warmup = true
parallel = 1
reasoning = "off"
temperature = 0.0

# ── external services ────────────────────────────────────────────────

[serving.retrieval.embedding]
manage = true
host = "127.0.0.1"
port = 8081
model = "~/models/qwen3-embedding-0.6b/Qwen3-Embedding-0.6B-Q4_K_M.gguf"
threads = 12
threads_batch = 12
ubatch_size = 2048
ctx_size = 4096
parallel = 1
n_gpu_layers = 999
device = "CUDA0"
ready_timeout = 300.0
poll_interval = 1.0
request_timeout = 30.0

[serving.retrieval.reranker]
manage = true
host = "127.0.0.1"
port = 8082
model = "~/models/qwen3-reranker-0.6b/Qwen3-Reranker-0.6B-Q4_K_M.gguf"
threads = 4
threads_batch = 4
ubatch_size = 2048
device = "CUDA0"
ctx_size = 8192
parallel = 1
n_gpu_layers = 999
cache_ram = 0
ready_timeout = 300.0
poll_interval = 1.0
request_timeout = 30.0

[embeddings]
model = "Qwen3-Embedding-0.6B"
dimension = 1024
batch_size = 32
base_url = "http://127.0.0.1:8081/v1"
timeout_seconds = 120.0

[reranker]
model = "Qwen3-Reranker-0.6B"
batch_size = 8
base_url = "http://127.0.0.1:8082/v1"
timeout_seconds = 120.0

[ocr]
model = "mistral-ocr-latest"
url = "https://api.mistral.ai/v1/ocr"
render_scale = 1.0
block_crop_scale = 1.0

[database]
database = "neo4j"
transport = "auto"
http_timeout = 60.0
bolt_probe_timeout = 5.0
max_connection_lifetime = 300.0
http_port = 7474
https_port = 7473

# ── module settings ─────────────────────────────────────────────────

[image]
max_dim = 768

[concurrency]
max_concurrent_calls = 16
recursion_limit = 1000

[recording]
enabled = true

[stages.splitter]
backward_context_budget = 200
lookahead_budget = 2000

[stages.finders.instruction_finder]
context_budget = 300
max_span_budget = 16000

[stages.finders.pedagogical]
start_before_budget = 300
start_after_budget = 300
end_before_budget = 300
end_after_budget = 300

[stages.entity_enrichment]
before_budget = 200
after_budget = 200
max_concurrent_calls = 16

[stages.event_enrichment]
before_budget = 200
after_budget = 200
max_concurrent_calls = 16

[stages.predicate_enrichment]
before_budget = 200
after_budget = 200
max_concurrent_calls = 16

[stages.triplet]
window_budget = 600
backward_context_budget = 400
forward_context_budget = 400

[stages.entity_hubs]
recall_threshold = 0.55
merge_above = 0.78
separate_below = 0.42
max_concurrent_calls = 16
comparison_token_budget = 4096
rerank_top_n = 5
rerank_candidate_limit = 32
[stages.event_hubs]
recall_threshold = 0.55
merge_above = 0.78
separate_below = 0.42
max_concurrent_calls = 16
comparison_token_budget = 4096
rerank_top_n = 5

[stages.predicate_hubs]
recall_threshold = 0.55
merge_above = 0.78
separate_below = 0.42
max_concurrent_calls = 16
comparison_token_budget = 4096
rerank_top_n = 5

[stages.image_enrichment]
before_budget = 200
after_budget = 200
max_concurrent_calls = 16

[stages.triplet_hubs]
max_concurrent_calls = 16

[stages.statement_enrichment]
max_concurrent_calls = 16

[stages.procedure_enrichment]
max_concurrent_calls = 16

[stages.governance]
backward_context_budget = 200
forward_context_budget = 500
max_concurrent_calls = 8

[stages.search]
top_k = 20
rerank_top_n = 5

[stages.procedure]
entity_definition_top_k = 10

[stages.statement_hubs]
recall_threshold = 0.55
merge_above = 0.78
separate_below = 0.42
max_concurrent_calls = 16
comparison_token_budget = 2048
rerank_top_n = 5
rerank_candidate_limit = 32

[stages.procedure_hubs]
recall_threshold = 0.55
merge_above = 0.78
separate_below = 0.42
max_concurrent_calls = 16
comparison_token_budget = 2048
rerank_top_n = 5
rerank_candidate_limit = 32

[stages.card_creation]
max_concurrent_calls = 16
